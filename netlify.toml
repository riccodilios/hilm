[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."ai-chat"]
  # Large workspace batch plans need headroom beyond the default; reliability still comes from create_many + parse recovery.
  timeout = 26

[functions."meeting-process"]
  # One audio part (~90s) is transcribed per invocation. Needs headroom for OpenRouter STT latency.
  # Keep under Netlify's 60s synchronous limit; gateway STT timeout is slightly lower.
  timeout = 60

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), display-capture=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; font-src 'self' data: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co https://openrouter.ai https://api.openrouter.ai https://cdn.jsdelivr.net; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hilm-demo.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "video/mp4"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"

# Public meeting links: never indexed, cached by shared caches, or leaked via Referer.
[[headers]]
  for = "/shared/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"

[[redirects]]
  from = "/api/notify-test"
  to = "/.netlify/functions/notify-test"
  status = 200

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/ai-daily-log"
  to = "/.netlify/functions/ai-daily-log"
  status = 200

[[redirects]]
  from = "/api/meeting-process"
  to = "/.netlify/functions/meeting-process"
  status = 200

[[redirects]]
  from = "/api/meeting-stt-webhook"
  to = "/.netlify/functions/meeting-stt-webhook"
  status = 200

# Domain split (mirrors src/lib/domains.ts): hilm.tech = public site, app.hilm.tech = the product.
# Query strings (e.g. auth codes) are forwarded. Other hosts keep serving everything.
[[redirects]]
  from = "https://app.hilm.tech/"
  to = "https://app.hilm.tech/login"
  status = 302
  force = true

[[redirects]]
  from = "https://app.hilm.tech/privacy"
  to = "https://hilm.tech/privacy"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/login"
  to = "https://app.hilm.tech/login"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/signup"
  to = "https://app.hilm.tech/signup"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/onboarding"
  to = "https://app.hilm.tech/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/auth/*"
  to = "https://app.hilm.tech/auth/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/shared/*"
  to = "https://app.hilm.tech/shared/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/personal"
  to = "https://app.hilm.tech/personal"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/personal/*"
  to = "https://app.hilm.tech/personal/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/workspace"
  to = "https://app.hilm.tech/workspace"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/workspace/*"
  to = "https://app.hilm.tech/workspace/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/app/*"
  to = "https://app.hilm.tech/app/:splat"
  status = 301
  force = true

# Reminder job is intentionally not publicly aliased — invoke /.netlify/functions/send-task-reminders with CRON_SECRET
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
