[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

# Keep API/functions ahead of the SPA fallback
[[redirects]]
  from = "/api/send-task-reminders"
  to = "/.netlify/functions/send-task-reminders"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
