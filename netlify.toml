[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."ai-chat"]
  # Large workspace batch plans need headroom beyond the default; reliability still comes from create_many + parse recovery.
  timeout = 26

[functions."meeting-process"]
  # One audio part (~90s) is transcribed per invocation. Needs headroom for OpenRouter STT latency.
  # Keep under Netlify's 60s synchronous limit; gateway STT timeout is slightly lower.
  timeout = 60

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), display-capture=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; font-src 'self' data: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: blob: https://*.supabase.co wss://*.supabase.co https://openrouter.ai https://api.openrouter.ai https://cdn.jsdelivr.net; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hilm-demo.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
    Content-Type = "video/mp4"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"

# Public meeting links: never indexed, cached by shared caches, or leaked via Referer.
[[headers]]
  for = "/shared/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"

# Private app surfaces: never indexed (sign-in and database permissions remain the access control).
[[headers]]
  for = "/personal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/personal"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/workspace/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/workspace"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/onboarding"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Prerendered files are served at their public URLs; the raw paths must not be indexed.
[[headers]]
  for = "/_public/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# SEO / AI discovery files
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots-app.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/api/notify-test"
  to = "/.netlify/functions/notify-test"
  status = 200

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

# Per-IP flood protection in front of the per-user AI quotas enforced in the database.
[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/ai-daily-log"
  to = "/.netlify/functions/ai-daily-log"
  status = 200
  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/meeting-process"
  to = "/.netlify/functions/meeting-process"
  status = 200
  [redirects.rate_limit]
    window_limit = 300
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/meeting-stt-webhook"
  to = "/.netlify/functions/meeting-stt-webhook"
  status = 200

# Domain split (mirrors src/lib/domains.ts): hilm.tech = public site, app.hilm.tech = the product.
# Query strings (e.g. auth codes) are forwarded. Public-page rules for every host are generated
# into dist/_redirects by scripts/prerender-public.mjs (applied before these rules).
# app.hilm.tech/ serves the app shell, which routes in the browser (sign in, or straight to the
# workspace for a signed-in user) without an extra server redirect.

# Retired Netlify subdomain: /api keeps working (rules above); everything else moves to the app.
[[redirects]]
  from = "https://hillm.netlify.app/*"
  to = "https://app.hilm.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/login"
  to = "https://app.hilm.tech/login"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/signup"
  to = "https://app.hilm.tech/signup"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/onboarding"
  to = "https://app.hilm.tech/onboarding"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/auth/*"
  to = "https://app.hilm.tech/auth/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/shared/*"
  to = "https://app.hilm.tech/shared/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/personal"
  to = "https://app.hilm.tech/personal"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/personal/*"
  to = "https://app.hilm.tech/personal/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/workspace"
  to = "https://app.hilm.tech/workspace"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/workspace/*"
  to = "https://app.hilm.tech/workspace/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://hilm.tech/app/*"
  to = "https://app.hilm.tech/app/:splat"
  status = 301
  force = true

# Reminder job is intentionally not publicly aliased — invoke /.netlify/functions/send-task-reminders with CRON_SECRET
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
